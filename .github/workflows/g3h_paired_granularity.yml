name: G3h paired Tiny Shakespeare granularity

on:
  push:
    branches: [g3b-learned-causal-replication]
    paths:
      - "experiments/g3h_paired_granularity_lm.py"
      - ".github/workflows/g3h_paired_granularity.yml"
  pull_request:
    branches: [main]
    paths:
      - "experiments/g3h_paired_granularity_lm.py"
      - ".github/workflows/g3h_paired_granularity.yml"
  workflow_dispatch:

jobs:
  paired-granularity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU research dependencies
        run: |
          mkdir -p .cache results
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5"
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Fetch canonical Tiny Shakespeare corpus
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt \
            -o .cache/tinyshakespeare.txt
          python - <<'PY' | tee results/dataset.txt
          import hashlib
          from pathlib import Path
          data = Path('.cache/tinyshakespeare.txt').read_bytes()
          blob_sha = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          print(f'bytes={len(data)}')
          print(f'sha256={hashlib.sha256(data).hexdigest()}')
          print(f'git_blob_sha1={blob_sha}')
          expected = '7dcb3a2d4cc3b48b6283dd46870bfeb78f88aac9'
          if blob_sha != expected:
              raise SystemExit(f'canonical corpus mismatch: {blob_sha} != {expected}')
          PY
      - name: Run paired fixed-total-capacity granularity sweep
        run: |
          PYTHONUNBUFFERED=1 python experiments/g3h_paired_granularity_lm.py \
            --text-path .cache/tinyshakespeare.txt \
            --corpus-bytes 1200000 \
            --checkpoint .cache/g3h_tinyshakespeare_base.pt \
            --retrain-backbone \
            --conditions 4096:8,16384:6,65536:4 \
            --seeds 7,8,9 \
            | tee results/g3h_paired_granularity.txt
      - name: Record environment
        if: always()
        run: |
          mkdir -p results
          python - <<'PY' > results/environment.txt
          import platform
          import numpy
          import torch
          print(f'python={platform.python_version()}')
          print(f'platform={platform.platform()}')
          print(f'numpy={numpy.__version__}')
          print(f'torch={torch.__version__}')
          PY
      - name: Upload paired granularity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3h-paired-granularity-results
          path: results/
          if-no-files-found: error
