name: Unit and reference tests

on:
  push:
    branches: [g3b-learned-causal-replication]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.3.5" "pytest==8.4.2"
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Run tests
        env:
          PYTHONPATH: .:src
        run: pytest -q
